name: skill-release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skill_version: ${{ steps.version.outputs.skill_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require registry publication credentials
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          SKILLS_HUB_AI_API_KEY: ${{ secrets.SKILLS_HUB_AI_API_KEY }}
        run: |
          test -n "$CLAWHUB_TOKEN" || {
            echo "::error::Missing required repository secret CLAWHUB_TOKEN."
            exit 1
          }
          test -n "$SKILLS_HUB_AI_API_KEY" || {
            echo "::error::Missing required repository secret SKILLS_HUB_AI_API_KEY."
            exit 1
          }

      - name: Read and validate the skill version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          content = Path("skills/api-to-typemcp/SKILL.md").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*([^\s#]+)\s*$", content, re.MULTILINE)
          if match is None:
              raise SystemExit("SKILL.md frontmatter must declare version.")
          version = match.group(1)
          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          if semver.fullmatch(version) is None:
              raise SystemExit(f"SKILL.md version is not SemVer: {version!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"skill_version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SKILL_VERSION: ${{ needs.prepare.outputs.skill_version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$GITHUB_SHA" || {
              echo "::error::Existing $TAG does not target this main commit."
              exit 1
            }
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "api-to-typemcp v${SKILL_VERSION}" \
            --generate-notes

  publish-clawhub:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SKILL_VERSION: ${{ needs.prepare.outputs.skill_version }}
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
      CLAWHUB_SOURCE_REF: 306035cad779533e212a1fafd4c9938ea4c0b70e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned ClawHub CLI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openclaw/clawhub
          ref: ${{ env.CLAWHUB_SOURCE_REF }}
          path: .clawhub-source
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install pinned ClawHub CLI dependencies
        working-directory: .clawhub-source
        run: bun install --frozen-lockfile

      - name: Register the released skill in ClawHub
        env:
          CLAWHUB_REGISTRY: https://clawhub.ai
          CLAWHUB_SITE: https://clawhub.ai
        run: |
          test -n "$CLAWHUB_TOKEN" || {
            echo "::error::Missing required repository secret CLAWHUB_TOKEN."
            exit 1
          }
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          config_path.write_text(
              json.dumps({"registry": os.environ["CLAWHUB_REGISTRY"], "token": os.environ["CLAWHUB_TOKEN"]}) + "\n",
              encoding="utf-8",
          )
          config_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"CLAWHUB_CONFIG_PATH={config_path}\n")
          PY
          export CLAWHUB_CONFIG_PATH="$RUNNER_TEMP/clawhub-config.json"
          bun .clawhub-source/packages/clawhub/src/cli.ts \
            --no-input \
            --workdir "$GITHUB_WORKSPACE" \
            --site "$CLAWHUB_SITE" \
            --registry "$CLAWHUB_REGISTRY" \
            skill publish skills/api-to-typemcp \
            --version "$SKILL_VERSION" \
            --json \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref main \
            --source-path skills/api-to-typemcp

  publish-skills-hub-ai:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SKILL_VERSION: ${{ needs.prepare.outputs.skill_version }}
      SKILLS_HUB_AI_API_KEY: ${{ secrets.SKILLS_HUB_AI_API_KEY }}
      SKILLS_HUB_AI_API: https://api.skills-hub.ai/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Register the released skill in skills-hub.ai
        run: |
          test -n "$SKILLS_HUB_AI_API_KEY" || {
            echo "::error::Missing required repository secret SKILLS_HUB_AI_API_KEY."
            exit 1
          }
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          api = os.environ["SKILLS_HUB_AI_API"].rstrip("/")
          token = os.environ["SKILLS_HUB_AI_API_KEY"]
          content = Path("skills/api-to-typemcp/SKILL.md").read_text(encoding="utf-8")

          def field(name: str) -> str:
              match = re.search(rf"^{re.escape(name)}:\s*([^\n#]+?)\s*$", content, re.MULTILINE)
              if match is None:
                  raise SystemExit(f"SKILL.md frontmatter must declare {name}.")
              return match.group(1).strip().strip('"')

          name = field("name")
          description = field("description")
          skill_version = field("version")
          category = field("category")
          if skill_version != os.environ["SKILL_VERSION"]:
              raise SystemExit("SKILL.md version does not match the release version.")

          def request(path: str, method: str = "GET", payload: dict[str, object] | None = None) -> tuple[int, object | None]:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-Skills-Hub-Client": "github-actions",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except HTTPError as error:
                  raw = error.read()
                  try:
                      return error.code, json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      return error.code, None
              except URLError as error:
                  raise SystemExit(f"skills-hub.ai request failed: {error.reason}") from error

          slug = name
          status, existing = request(f"/skills/{slug}")
          if status == 404:
              status, created = request(
                  "/skills",
                  "POST",
                  {
                      "name": name,
                      "description": description,
                      "version": skill_version,
                      "categorySlug": category,
                      "platforms": ["CLAUDE_CODE"],
                      "instructions": content.split("---", 2)[-1].strip(),
                      "visibility": "PUBLIC",
                      "tags": ["mcp", "api", "openapi", "swagger", "type-mcp"],
                      "githubRepoUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
                  },
              )
              if status not in (200, 201) or not isinstance(created, dict) or not isinstance(created.get("slug"), str):
                  raise SystemExit(f"skills-hub.ai skill creation failed (HTTP {status}).")
              slug = created["slug"]
              status, _ = request(f"/skills/{slug}/publish", "POST", {})
              if status not in (200, 201, 204):
                  raise SystemExit(f"skills-hub.ai skill publication failed (HTTP {status}).")
          elif status == 200:
              status, _ = request(
                  f"/skills/{slug}/versions",
                  "POST",
                  {
                      "version": skill_version,
                      "instructions": content.split("---", 2)[-1].strip(),
                      "changelog": f"Released from GitHub {os.environ['GITHUB_SHA']}.",
                  },
              )
              if status not in (200, 201):
                  raise SystemExit(f"skills-hub.ai version publication failed (HTTP {status}).")
          else:
              raise SystemExit(f"skills-hub.ai skill lookup failed (HTTP {status}).")

          print(f"Published {slug} v{skill_version} to skills-hub.ai.")
          PY
