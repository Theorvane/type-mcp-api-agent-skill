<!DOCTYPE html>
<html lang="en">
<head><title>API Reference</title></head>
<body>
<h1>Petstore API Reference</h1>
<section>
  <h2>Endpoints</h2>
  <div class="endpoint">
    <h3>List Pets</h3>
    <p><code>GET /pets</code></p>
    <p>Returns all pets.</p>
  </div>
  <div class="endpoint">
    <h3>Create Pet</h3>
    <p><code>POST /pets</code></p>
    <p>Creates a new pet.</p>
  </div>
  <div class="endpoint">
    <h3>Get Pet by ID</h3>
    <p><code>GET /pets/{petId}</code></p>
    <p>Returns a single pet.</p>
  </div>
</section>
<section>
  <h2>Errors</h2>
  <p>Standard HTTP error codes apply.</p>
</section>
</body>
</html>
